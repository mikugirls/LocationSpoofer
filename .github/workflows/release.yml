name: Release on Version Update

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/build.gradle.kts'
  # 新增：支持手动触发，可输入密钥信息（都有默认值）
  workflow_dispatch:
    inputs:
      keystore_password:
        description: '密钥库密码'
        required: false
        default: 'key10086'
      key_alias:
        description: '密钥别名'
        required: false
        default: 'key10086'
      key_password:
        description: '密钥密码'
        required: false
        default: 'key10086'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Version Changed
        id: check_version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          echo "当前代码中的 versionName: $VERSION_NAME"
          
          if [ -z "$VERSION_NAME" ]; then
            echo "未能提取到 versionName，退出。"
            exit 1
          fi
          
          TAG_NAME="v$VERSION_NAME"
          
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME 已经存在，跳过后续操作。"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "检测到新版本，将构建并发布 $TAG_NAME。"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        if: steps.check_version.outputs.changed == 'true'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            LOGS=$(git log --no-merges --pretty=format:"- %s")
          else
            LOGS=$(git log $PREV_TAG..HEAD --no-merges --pretty=format:"- %s")
          fi
          
          echo "$LOGS" > changelog.txt
          cat changelog.txt

      - name: Setup Java
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ---------- 密钥生成（优先使用手动输入，否则用默认 key10086）----------
      - name: Generate Keystore
        if: steps.check_version.outputs.changed == 'true'
        run: |
          # 若为 workflow_dispatch 触发则取输入，否则都用默认值 key10086
          STORE_PASS="${{ github.event.inputs.keystore_password || 'key10086' }}"
          KEY_ALIAS="${{ github.event.inputs.key_alias || 'key10086' }}"
          KEY_PASS="${{ github.event.inputs.key_password || 'key10086' }}"
          
          # 固定组织信息（可改）
          DNAME="CN=CI Build, OU=Auto, O=GitHubActions, L=Nowhere, S=Nowhere, C=XX"
          
          keytool -genkey -v \
            -keystore $RUNNER_TEMP/keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "$DNAME"
          
          # 传递给后续步骤
          echo "KEYSTORE_FILE_PATH=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: Build Release APK
        if: steps.check_version.outputs.changed == 'true'
        env:
          KEYSTORE_FILE_PATH: ${{ env.KEYSTORE_FILE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

          APK_DIR="app/build/outputs/apk/release"
          find $APK_DIR -name "*.apk" -print0 | while IFS= read -r -d '' file; do
            mv "$file" "$APK_DIR/LocationSpoofer-${{ steps.check_version.outputs.tag }}.apk"
          done

      - name: Publish GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: LocationSpoofer ${{ steps.check_version.outputs.tag }}
          body_path: changelog.txt
          files: app/build/outputs/apk/release/LocationSpoofer-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
